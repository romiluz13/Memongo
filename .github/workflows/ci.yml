name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (monorepo)
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check package artifacts
        run: bun run check-publishability --artifacts-only

      - name: Test
        run: bun run test

      # Skip-green guard: a green run must contain executed tests. Catches
      # suites that silently skip (describe.skipIf on missing env), packages
      # that lose their test script, and JUnit emission breaking. The
      # conformance require-suite is file-path anchored so only the api's
      # OpenAPI drift guard satisfies it: reverting the api test script to
      # an exclusionary form fails here.
      - name: Verify tests ran (skip-green guard)
        run: >
          bun scripts/ci/verify-tests-ran.mjs
          --expect apps/api/test-results/junit.xml
          --expect apps/mcp/test-results/junit.xml
          --expect packages/client/test-results/junit.xml
          --expect packages/lib/test-results/junit.xml
          --expect packages/memory-bridge/test-results/junit.xml
          --expect packages/memory-engine/test-results/junit.xml
          --expect packages/pi-extension/test-results/junit.xml
          --expect packages/tools/test-results/junit.xml
          --expect scripts/test-results/junit.xml
          --require-suite src/contract-conformance.test.ts

  e2e:
    name: E2E against real MongoDB (tier A)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Keyless on purpose: tier A never embeds, and the search-barrier suite
      # expects a service without a provider key.
      mongodb:
        image: mongodb/mongodb-atlas-local:preview@sha256:ff75fd47e918952cc91094e888e8aeb7529aeb70f987b075aeef3944c9bd8014
        ports:
          - 27017:27017
        env:
          MONGODB_ATLAS_TELEMETRY_ENABLE: "false"
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Tier A covers the paths that need only MongoDB: transactions, indexes,
      # tenant isolation, and background jobs. Tiers needing a Voyage/LLM key
      # run in the nightly workflow, so this job gates every PR without secrets.
      - name: E2E (tier A)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          MEMONGO_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
        run: bun run --filter @memongo/memory-engine test:e2e:tier-a

      # Skip-green guard for tier A: every gated file must have executed at
      # least one test, so a renamed file or a newly added skip cannot shrink
      # the tier silently. Expected-gated cases boot the full required-index
      # manifest through the public factory, which needs autoEmbed and so a
      # model key; tier A is keyless, so each must be present and skipped.
      - name: Verify tier A suites ran (skip-green guard)
        run: >
          bun scripts/ci/verify-tests-ran.mjs
          --expect packages/memory-engine/test-results/junit.xml
          --expect-gated "recovers and executes staged outbox work through the public manager factory"
          --require-suite mongodb-kb-reingest.e2e.test.ts
          --require-suite mongodb-kb-isolation.e2e.test.ts
          --require-suite mongodb-vector-index-shape.e2e.test.ts
          --require-suite mongodb-rankfusion-score.e2e.test.ts
          --require-suite mongodb-projection-repair.e2e.test.ts
          --require-suite mongodb-temporal-validity.e2e.test.ts
          --require-suite mongodb-memory-jobs.e2e.test.ts
          --require-suite mongodb-search-barrier.e2e.test.ts

  # M2 startup contract controls, keyless: nothing here embeds. A deployment
  # without Search, an index boot cannot repair and a user without Search
  # index management privileges each fail boot typed, and the built API exits
  # 1 without binding its port. Boot repairs a missing index; keyless, the
  # autoEmbed create is then refused typed (the keyed proof-pack job boots the
  # full manifest). FAILED, STALE and 5280803's warn-and-serve are fake-Db
  # controls run in the same step, since a real server cannot be made to
  # produce those states on demand.
  boot-control:
    name: Startup contract controls (keyless MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:preview@sha256:ff75fd47e918952cc91094e888e8aeb7529aeb70f987b075aeef3944c9bd8014
        ports:
          - 27017:27017
        env:
          MONGODB_ATLAS_TELEMETRY_ENABLE: "false"
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Node 22 matches the API image; the control spawns apps/api/dist/server.js.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The same pinned image run as a bare mongod: same server version, no
      # mongot, so Search index management is unavailable.
      - name: Start a MongoDB without Search
        run: >
          docker run -d --name memongo-no-search -p 27018:27017
          --entrypoint mongod
          mongodb/mongodb-atlas-local:preview@sha256:ff75fd47e918952cc91094e888e8aeb7529aeb70f987b075aeef3944c9bd8014
          --bind_ip_all

      - name: Startup contract controls
        working-directory: packages/memory-engine
        env:
          MEMONGO_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
          MEMONGO_BOOT_CONTROL_NO_SEARCH_URI: mongodb://127.0.0.1:27018/?directConnection=true
          MEMONGO_BOOT_CONTROL: "1"
        run: >
          bunx vitest run --no-file-parallelism --config vitest.e2e.config.ts
          src/mongodb-boot-contract.e2e.test.ts
          src/mongodb-boot-contract.test.ts
          src/mongodb-boot-controls.test.ts

      - name: Verify startup contract suites ran (skip-green guard)
        run: >
          bun scripts/ci/verify-tests-ran.mjs
          --expect packages/memory-engine/test-results/junit.xml
          --require-suite mongodb-boot-contract.e2e.test.ts
          --require-suite mongodb-boot-contract.test.ts
          --require-suite mongodb-boot-controls.test.ts

  # The api-contract lane runs in its own job so paid embeddings happen only
  # here: Rom's grant is this PR job, at most 60 barrier probe embeddings per
  # run, on the existing VOYAGE_API_KEY secret.
  proof-pack:
    name: API contract proof-pack (keyed MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:preview@sha256:ff75fd47e918952cc91094e888e8aeb7529aeb70f987b075aeef3944c9bd8014
        ports:
          - 27017:27017
        env:
          MONGODB_ATLAS_TELEMETRY_ENABLE: "false"
          # Auto-embeddings are served by mongot inside the container, so the
          # Atlas Model key must be on the container for the proof-pack's
          # vector and hybrid lanes and its barrier probes.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s
    steps:
      # Zero fallbacks: without the key (a fork PR, or the secret unset) the
      # API would silently serve search from $text, so the job fails here
      # instead of skipping or going green on the fallback.
      - name: Assert Voyage key is armed for the proof-pack (no fallback)
        env:
          VOYAGE_KEY_PRESENT: ${{ secrets.VOYAGE_API_KEY != '' }}
        run: |
          if [[ "${VOYAGE_KEY_PRESENT}" != "true" ]]; then
            echo "::error::VOYAGE_API_KEY secret is empty: the MongoDB service cannot embed, so the proof-pack would run on the \$text fallback"
            exit 1
          fi
          echo "VOYAGE_API_KEY secret present on the MongoDB service container"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Node 22 matches the API image (apps/api/Dockerfile), which runs the
      # built apps/api/dist/server.js that the proof-pack step starts.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The unweakened 15-check proof-pack against this PR's built API on
      # loopback, with its own database, agent and API key. The API process
      # gets no provider key; embeddings come from the MongoDB service. A
      # startup failure, a missing check, a failed check or a degraded search
      # lane fails the job.
      - name: API contract proof-pack (15 checks)
        id: proof_pack
        timeout-minutes: 10
        env:
          MEMONGO_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
          PROOF_PACK_OUT_DIR: ${{ runner.temp }}/proof-pack
        run: bash scripts/ci/run-proof-pack.sh

      # Failure-only and diagnostic only: the service container's log (mongod
      # and mongot) and the proof database's search-index status, each bounded
      # and scrubbed of URIs, keys and document text before upload. Index status
      # is never a visibility signal. The raw log never enters the artifact.
      - name: Collect proof-pack diagnostics (service log, search-index status)
        if: failure() && steps.proof_pack.outcome == 'failure'
        timeout-minutes: 3
        env:
          MEMONGO_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
          PROOF_PACK_OUT_DIR: ${{ runner.temp }}/proof-pack
          SERVICE_CONTAINER_ID: ${{ job.services.mongodb.id }}
          # Read only so the scrubber can remove the key verbatim.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          raw_log="$(mktemp)"
          status=0
          docker logs --tail 20000 "${SERVICE_CONTAINER_ID}" >"${raw_log}" 2>&1 || status=$?
          bun scripts/ci/collect-proof-pack-diagnostics.ts "${raw_log}" "${PROOF_PACK_OUT_DIR}/diagnostics" "${PROOF_PACK_OUT_DIR}/database.txt" || status=$?
          rm -f "${raw_log}"
          exit "${status}"

      - name: Upload proof-pack evidence (API log, PID, verdict, diagnostics)
        if: failure() && steps.proof_pack.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: proof-pack-evidence
          path: ${{ runner.temp }}/proof-pack
          if-no-files-found: error
