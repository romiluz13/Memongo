name: Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Skip-green guard: publishing gates on a run that actually executed
      # the full suite, not on a green exit with silently skipped packages.
      # The conformance require-suite keeps the OpenAPI drift guard in the
      # run that gates publishing.
      - name: Verify tests ran (skip-green guard)
        run: >
          bun scripts/ci/verify-tests-ran.mjs
          --expect apps/api/test-results/junit.xml
          --expect apps/mcp/test-results/junit.xml
          --expect packages/client/test-results/junit.xml
          --expect packages/lib/test-results/junit.xml
          --expect packages/memory-bridge/test-results/junit.xml
          --expect packages/memory-engine/test-results/junit.xml
          --expect packages/pi-extension/test-results/junit.xml
          --expect packages/tools/test-results/junit.xml
          --expect scripts/test-results/junit.xml
          --require-suite src/contract-conformance.test.ts

      - name: Check publishability
        run: bun run check-publishability

      - name: Publish packages
        run: |
          for pkg in \
            packages/lib \
            packages/memory-engine \
            packages/memory-bridge \
            packages/memongo-memory \
            packages/client \
            packages/tools \
            packages/pi-extension \
            apps/mcp
          do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            is_private=$(node -e "console.log(require('./$pkg/package.json').private === true)")
            if [ "$is_private" = "true" ]; then
              echo "Refusing to skip private package $name@$version."
              exit 1
            fi

            echo "Publishing $name@$version..."
            (cd "$pkg" && npm publish --access public --provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
