name: Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm provenance is required for package publishing. pnpm supports
      # `publish --provenance`; Bun remains the repo package manager.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check publishability
        run: bun run check-publishability

      - name: Publish packages
        run: |
          for pkg in \
            packages/lib \
            packages/memory-engine \
            packages/memory-bridge \
            packages/memongo-memory \
            packages/client \
            packages/tools
          do
            is_private=$(node -e "console.log(require('./$pkg/package.json').private === true)")
            if [ "$is_private" = "true" ]; then
              continue
            fi

            echo "Publishing $pkg..."
            (cd "$pkg" && pnpm publish --access public --no-git-checks --provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
