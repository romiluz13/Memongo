# MongoDB only — run `memongo-platform/apps/api` on the host with
# OPENCLAW_MONGODB_URI=mongodb://127.0.0.1:27017/openclaw?directConnection=true
# (or point at this service from `mongodb://mongodb:27017/...` when the API runs in another container).
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - memongo_mongo_data:/data/db

volumes:
  memongo_mongo_data: {}
