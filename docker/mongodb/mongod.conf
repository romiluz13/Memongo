# mongod.conf - MongoDB Community Server configuration for Memongo
# Adapted from github.com/JohnGUnderwood/mdb-community-search

net:
   port: 27017
   # Bind only to loopback (in-container init/healthchecks) and this
   # container's memongo-net address (mongot, rs-init, and the loopback-only
   # published host port all reach it there). Do NOT use bindIpAll.
   bindIp: localhost,memongo-mongod.memongo-net

replication:
   replSetName: rs0

setParameter:
   # mongot connection parameters (required for $vectorSearch, $search)
   searchIndexManagementHostAndPort: memongo-mongot.memongo-net:27028
   mongotHost: memongo-mongot.memongo-net:27028
   skipAuthenticationToSearchIndexManagementServer: false
   useGrpcForSearch: true

security:
   authorization: enabled
   keyFile: /auth/keyfile
