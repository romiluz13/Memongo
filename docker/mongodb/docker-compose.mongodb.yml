# docker-compose.mongodb.yml - MongoDB setup for Memongo
# Adapted from github.com/JohnGUnderwood/mdb-community-search
#
# Usage:
#   Full stack (mongod + mongot + vector search):
#     docker compose -f docker/mongodb/docker-compose.mongodb.yml --profile setup run --rm setup-generator
#     docker compose -f docker/mongodb/docker-compose.mongodb.yml --profile fullstack up -d
#
#   Replica set only (transactions, no vector search):
#     docker compose -f docker/mongodb/docker-compose.mongodb.yml --profile replicaset up -d
#
#   Standalone (simplest, no transactions or search):
#     docker compose -f docker/mongodb/docker-compose.mongodb.yml --profile standalone up -d

services:
  # One-time setup: generates keyfile, password files, optional Voyage API key files
  setup-generator:
    image: alpine:3.22
    container_name: memongo-setup
    volumes:
      - auth-files:/auth
      - ./.runtime:/runtime
      - ./setup-generator.sh:/setup-generator.sh:ro
      - ./mongot.conf:/templates/mongot.conf:ro
    environment:
      # Required: fail closed if passwords are not set (no baked defaults).
      - MONGOT_PASSWORD=${MONGOT_PASSWORD:?set MONGOT_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - VOYAGE_API_QUERY_KEY=${VOYAGE_API_QUERY_KEY:-}
      - VOYAGE_API_INDEXING_KEY=${VOYAGE_API_INDEXING_KEY:-}
      - MONGOT_EMBEDDING_PROVIDER_ENDPOINT=${MONGOT_EMBEDDING_PROVIDER_ENDPOINT:-https://ai.mongodb.com/v1/embeddings}
      - MONGOT_GENERATED_FILE=/runtime/mongot.generated.yml
    command: ["/setup-generator.sh"]
    restart: "no"
    profiles:
      - setup

  # Tier 1: Standalone MongoDB (simplest - no transactions, no search)
  mongod-standalone:
    image: mongodb/mongodb-community-server:8.0.13-ubuntu2204
    container_name: memongo-mongod-standalone
    ports:
      # Loopback-only publish (compose-spec short syntax).
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongod_standalone_data:/data/db
    profiles:
      - standalone
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tier 2 & 3: MongoDB with replica set (used by both replicaset and fullstack profiles)
  mongod:
    image: mongodb/mongodb-community-server:8.0.13-ubuntu2204
    container_name: memongo-mongod
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      # Required: fail closed if passwords are not set (no baked defaults).
      MONGODB_INITDB_ROOT_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:?set MONGOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    # replSetName comes from /etc/mongod.conf (rs0). The replica set is
    # initiated by the one-shot rs-init service below.
    command: >-
      mongod
      --config /etc/mongod.conf
    ports:
      # Loopback-only publish (compose-spec short syntax).
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongod_data:/data/db
      - mongod_configdb:/data/configdb
      - ./mongod.conf:/etc/mongod.conf:ro
      - auth-files:/auth
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - memongo-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - replicaset
      - fullstack

  # One-shot replica set initiator: mongod.conf sets replSetName rs0 but
  # nothing else initiates it — without rs.initiate there is no primary, no
  # oplog, no transactions, and mongot has nothing to sync from.
  # Idempotent: an already-initialized set is treated as success.
  rs-init:
    image: mongodb/mongodb-community-server:8.0.13-ubuntu2204
    container_name: memongo-rs-init
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      mongod:
        condition: service_healthy
    volumes:
      - ./rs-init.sh:/rs-init.sh:ro
    networks:
      - memongo-net
    command: ["/bin/bash", "/rs-init.sh"]
    restart: "no"
    profiles:
      - replicaset
      - fullstack

  # Tier 3: mongot search engine (fullstack only)
  mongot:
    image: mongodb/mongodb-community-search:1.70.1
    container_name: memongo-mongot
    environment:
      MONGOT_EMBEDDING_PROVIDER_ENDPOINT: ${MONGOT_EMBEDDING_PROVIDER_ENDPOINT:-https://ai.mongodb.com/v1/embeddings}
    ports:
      # Loopback-only publish (compose-spec short syntax).
      - "127.0.0.1:${MONGOT_GRPC_PORT:-27028}:27028"
      - "127.0.0.1:${MONGOT_HEALTH_PORT:-8080}:8080"
      - "127.0.0.1:${MONGOT_METRICS_PORT:-9946}:9946"
    volumes:
      - mongot_data:/data/mongot
      - ./.runtime/mongot.generated.yml:/mongot-community/config.default.yml:ro
      - auth-files:/auth
    networks:
      - memongo-net
    depends_on:
      # mongot syncs from the replica set oplog, so it must wait until
      # rs-init has actually initiated rs0 (not just mongod being up).
      rs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://memongo-mongot.memongo-net:9946/metrics",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - fullstack

volumes:
  mongod_standalone_data:
  mongod_data:
  mongod_configdb:
  mongot_data:
  auth-files:

networks:
  memongo-net:
    name: memongo-net
    driver: bridge
