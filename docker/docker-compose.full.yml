# docker-compose.full.yml - Memongo full stack (API + optional local MongoDB)
#
# One-command local development:
#   docker compose -f docker/docker-compose.full.yml --profile local up -d
#
# API only, connecting to MongoDB Atlas cloud:
#   MEMONGO_MONGODB_URI="mongodb+***********************************/?appName=memongo" \
#   MEMONGO_API_KEY="your-long-random-token" \
#   docker compose -f docker/docker-compose.full.yml up -d
#
# With local MongoDB + auto-embeddings:
#   VOYAGE_API_KEY="al-your-atlas-model-api-key" \
#   MEMONGO_API_KEY="your-long-random-token" \
#   docker compose -f docker/docker-compose.full.yml --profile local up -d
#
# Profiles:
#   (default)  — API only, expects MEMONGO_MONGODB_URI (Atlas or external Mongo)
#   local      — API + local MongoDB (mongodb-atlas-local preview container)

services:
  # ─── API server (always runs) ─────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: memongo-api
    ports:
      # Loopback-only publish (compose-spec short syntax): publishing on
      # 0.0.0.0 exposes the API on every host interface, which Docker
      # documents as insecure by default. Front with a reverse proxy or
      # publish explicitly if remote access is intended.
      - "127.0.0.1:${MEMONGO_API_PORT:-3847}:3847"
    environment:
      - NODE_ENV=production
      - MEMONGO_API_HOST=0.0.0.0
      - MEMONGO_API_PORT=3847
      # Required: fail closed if MEMONGO_API_KEY is not set (no baked default).
      - MEMONGO_API_KEY=${MEMONGO_API_KEY:?set MEMONGO_API_KEY}
      - MEMONGO_AGENT_ID=${MEMONGO_AGENT_ID:-main}
      # When using the local profile, point at the mongodb service container.
      # When using Atlas (default), set MEMONGO_MONGODB_URI to your +srv URI.
      - MEMONGO_MONGODB_URI=${MEMONGO_MONGODB_URI:-mongodb://mongodb:27017/?directConnection=true}
      # Database name inside MongoDB (engine default: memongo).
      - MEMONGO_MONGODB_DATABASE=${MEMONGO_MONGODB_DATABASE:-memongo}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Local MongoDB (only with --profile local) ────────────────────
  mongodb:
    # Pinned to a dated tag (verify auto-embedding parity when bumping).
    image: mongodb/mongodb-atlas-local:8.2.6-20260715T144108Z
    container_name: memongo-preview
    # Not published to the host: the API reaches MongoDB over the compose
    # network. Use docker/docker-compose.preview.yml for host-side tooling.
    expose:
      - "27017"
    environment:
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - MONGODB_ATLAS_TELEMETRY_ENABLE=false
    volumes:
      - memongo_preview_data:/data/db
      - memongo_preview_config:/data/configdb
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    profiles: ["local"]

volumes:
  memongo_preview_data:
  memongo_preview_config:
