non_blocking_observations: >
  The chunks TTL index and validator are correctly specified, all five central
  unit defenses are non-vacuously pinned, and agentId/scope/scopeRef isolation
  is retained by direct projectors. Tenant erasure is a valid independent
  deletion mechanism but does not satisfy time-based event retention.
  Analytics exposes stale aggregate counts rather than chunk text during TTL
  lag. Insert-only semantics are reasonable for immutable event IDs, but a fix
  must include a safe backfill or update strategy for chunks already created
  without expiresAt.

round_2:
  verdict: sustained
  refuter_id: "factory-droid worker subagent, independent C-005 round-2 refuter"
  fix_applied_between_rounds: >
    The implementer closed every round-1 gap. (1) mongodb-manager-write.ts
    now passes the resolved expiresAt through both the single-write handoff
    (projectEventChunk) and the batch handoff (projectEventChunksBatch), with
    the batch path computing expiry once per pending item so the event row and
    the chunk share the exact Date. (2) mongodb-events.ts projectEventChunk
    carries expiresAt in $set rather than $setOnInsert, so re-projection
    self-heals chunks written before the fix (events are immutable, so the
    rewrite is idempotent). (3) mongodb-manager-sync.ts outbox repair spreads
    the stored event expiry into its projection payload. (4)
    mongodb-conversation-windows.ts fetches session events with
    buildUnexpiredClause(), computes the window max expiry from its source
    events, $sets the window chunk expiry, and $unsets a stale expiry when the
    window turns permanent. (5) buildConversationChunkFilter and
    buildBridgeChunkFilter in mongodb-manager-search.ts both compose
    buildUnexpiredClause({field: "expiresAt"}). (6) readConversationChunk and
    readBridgeChunk in mongodb-manager-read.ts both compose the same guard via
    $and. (7) mongodb-session-evidence.ts adds
    SessionEvidenceDocument.expiresAt plus resolveSessionEvidenceExpiresAt
    (sessionId to latest source-event expiry) and writers accepting
    sessionExpiresAt. (8) mongodb-schema-standard-indexes-operations.ts adds
    idx_session_chunks_ttl_expires_at, a partial TTL index on session_chunks
    with expireAfterSeconds 0. (9) mongodb-search-v2.ts guards the
    session_chunks search lane with $or: [{expiresAt: null}, {expiresAt: {$gt:
    now}}]. (10) types.memory.ts JSDoc updated to describe the propagation
    coverage honestly.

  attempts:
    - id: attempt-6-pinning-tests
      description: >
        Re-run the implementer's focused pinning suites before probing:
        mongodb-chunk-retention.test.ts (20), mongodb-manager-write-state.test.ts
        (14), and the related schema/session-evidence/write-path pinning files
        (6 files, 186 tests total).
      outcome: all_passed
      detail: >
        186/186 passed. Confirms the pinning tests cover single and batch
        handoff propagation, projector self-heal via $set, readBridgeChunk and
        readConversationChunk guards, window exclusion and max-expiry stamping,
        outbox repair expiry, session-evidence expiry, and both TTL index
        contracts.
      evidence: refutation-c-005-r2-attempt-6-pinning-tests.log

    - id: attempt-7-independent-probe
      description: >
        Write an independent probe file (c005-r2-refuter-probe.test.ts, 8
        tests) targeting gaps the implementer's pinning tests did not cover:
        config-derived (sessionDays) TTL on the real manager path, explicit
        expiry precedence, window re-projection healing in both directions
        ($unset stale, $set later), lane fusion safety for the new $and-shaped
        guards, session_chunks null-equality semantics, and the residual
        bounded window leak.
      outcome: all_passed_with_one_fake_fidelity_caveat
      detail: >
        T1 config-derived TTL: event and chunk carry the same sessionDays-
        derived expiresAt through MongoDBManagerWriteOps. T2 window re-
        projection heals in both directions. T3 fuseChunkLaneFilters returns
        undefined for the new $and-shaped guarded filters, so both lanes run
        separately with their guards intact (no guard-dropping fusion). T4
        documented a stateful-fake fidelity divergence: the fake treats
        {expiresAt: null} as strict equality and does not match missing
        fields, whereas real $match semantics do; the guard is fail-CLOSED
        (over-exclusion, a recall risk at worst) under any interpretation
        because expired docs are excluded by both arms. T5 documented the
        residual bounded leak: a window chunk projected before its events
        expire retains the expired event text until the window's own stamped
        max expiry is reached (TTL-bound, self-terminating). All 8 passed
        after encoding the T4 fake divergence as an explicit assertion.
      evidence: refutation-c-005-r2-attempt-7-probe.log

    - id: attempt-8-vacuity
      description: >
        Seven targeted mutations against each new central defense, each
        requiring a focused assertion failure, byte-identical restoration
        (cmp exit 0), and a SHA-256 match against the pre-mutation baseline.
      outcome: all_caught
      detail: >
        M1 removed the expiresAt spread from the single-write projection
        handoff: "persists the event AND its chunk with the SAME explicit
        expiresAt (single write handoff)" failed; restored, hash OK.
        M2 removed the per-item expiresAt spread from the batch handoff:
        "propagates a per-item expiry through the batch write handoff" failed;
        restored, hash OK.
        M3 moved projectEventChunk expiresAt from $set back into $setOnInsert:
        "backfills expiresAt onto an existing chunk written without one"
        failed; restored, hash OK.
        M4 removed buildUnexpiredClause from readBridgeChunk's $and:
        "readBridgeChunk hides an expired bridge chunk" failed; restored,
        hash OK.
        M5 removed buildUnexpiredClause from the window event fetch:
        "excludes already-expired events from window text" failed, and the
        independent T5 probe failed simultaneously (cross-validation);
        restored, hash OK.
        M6 changed idx_session_chunks_ttl_expires_at expireAfterSeconds from 0
        to 60: "creates all standard indexes on chunks, KB, and
        structured_mem" failed; restored, hash OK.
        M7 removed the expiresAt spread from outbox repair: "projects the
        chunk with the STORED event expiry" failed; restored, hash OK.
      evidence: refutation-c-005-r2-attempt-8-m1.log through refutation-c-005-r2-attempt-8-m7.log

    - id: attempt-9-full-suite
      description: >
        Delete the probe file and run the complete memory-engine unit suite
        (excluding e2e) to confirm the resting tree is green.
      outcome: all_passed
      detail: >
        127 test files, 2122 tests, 0 failures. The probe file was verified
        absent afterwards.
      evidence: refutation-c-005-r2-attempt-9-full-suite.log

  conclusion: >
    Verdict: sustained in round 2. Every round-1 counterexample was re-run
    and now fails to reproduce: the single and batch write handoffs propagate
    the exact persisted expiry to chunks; the projector $set clause heals
    pre-fix chunks on re-projection; outbox repair carries the stored expiry;
    window projection excludes expired events at projection time and stamps
    the window max expiry (with $unset on permanent windows); bridge and
    direct locator readers compose the unexpired guard; session evidence
    carries source-derived expiry under its own partial TTL index; and the
    search-v2 session_chunks lane is guarded. All seven vacuity mutations
    against these defenses were caught by focused pinning assertions, so the
    coverage is non-vacuous. Two residual items remain, both fail-closed for
    retention and documented below; neither reopens the claim as stated.

