  non_blocking_observations: >
    (1) The session_chunks search-v2 lane guard uses $or: [{expiresAt: null},
    {expiresAt: {$gt: now}}] because (per the in-code comment) $vectorSearch
    pre-filters do not support $exists. Null equality matches missing fields
    under documented $match semantics, so the text lane is correct; the
    vector-only lane's behavior depends on mongot null-equality semantics,
    which could not be validated without a live mongot and are not covered by
    the stateful fake (strict equality). Any divergence is fail-CLOSED for
    retention (over-exclusion of permanent sessions, a recall risk), never a
    leak; recommend a live mongot validation test. (2) Residual bounded leak:
    a conversation-window chunk projected before its events expire retains
    expired event text until the window chunk's own stamped max expiry is
    reached and the TTL monitor sweeps it; the window is never re-projected
    after events expire because projection-time exclusion only affects
    subsequent re-projections. The leak is TTL-bound and self-terminating.
    (3) writeEventAndProject (a direct low-level writer) does not accept a TTL
    override and thus projects chunks without expiresAt; it is currently dead
    code outside tests, but if it becomes reachable for expiring events it
    would reintroduce the round-1 gap. (4) Analytics may still count expired
    rows during TTL-monitor lag (aggregate counts only, no chunk text).
