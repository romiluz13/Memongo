# Independent refutation report for T3 claim C-005
# ("Event retention MUST propagate to chunk projections: chunks MUST carry
# expiresAt with a TTL index, or a sweeper MUST delete chunks whose source
# event no longer exists, and until then the retention documentation MUST
# carry an explicit warning.")
claim_id: C-005
verdict: sustained
independence_verified: true
refuter_id: "factory-droid worker subagent, independent C-005 refuter"
implementer_id: "factory-droid primary agent, WS-03 implementer"
refuted_rounds: 1
sustained_rounds: 1
attempt_log_dir: .ddd/reports/runs/

attempts:
  - id: attempt-1-vacuity
    description: >
      Remove each central defense independently: single and batch expiry
      propagation, the conversation-read unexpired clause, the chunks TTL
      index contract, and the validator's optional expiresAt field. Require a
      focused assertion failure, byte-identical restoration, and green
      controls.
    outcome: caught
    detail: >
      All five mutations produced relevant assertion failures. The single and
      batch mutations each lost the expected Date; removing the guard failed
      both filter-shape and stateful visibility assertions; changing
      expireAfterSeconds from 0 to 60 failed the schema assertion; and removing
      expiresAt from CHUNKS_SCHEMA failed the validator assertion. Every source
      file was restored with cmp exit 0 and its original SHA-256. The pre- and
      post-mutation controls each passed 119/119.
    evidence: refutation-c-005-attempt-1-vacuity.log

  - id: attempt-2-declared-surfaces
    description: >
      Exercise the real manager event-recording paths with TTL enabled and an
      explicit override, verify the index definition, enumerate search and
      bridge filter call sites, and evaluate the public TTL documentation.
    outcome: refuted
    detail: >
      A stateful-fake probe through MongoDBManagerWriteOps demonstrated the
      surviving counterexample on both single and batch writes. The stored
      events carry the sessionDays-derived or explicit absolute expiresAt, but
      the corresponding event chunks have no expiresAt. mongodb-manager-write.ts
      computes and persists expiresAt, then reconstructs CanonicalEvent objects
      for projectEventChunk/projectEventChunksBatch without that field. The
      index definition is correct and pinned, but it cannot expire documents
      that lack the field. Conversation search lanes use the guarded filter;
      bridge search lanes use a separate unguarded filter. The JSDoc says the
      shipped behavior leaves no orphaned copies, so it is false rather than an
      explicit warning. The warning is moot only after propagation actually
      works; under an interpretation requiring a current warning, it is also
      absent.
    evidence: refutation-c-005-attempt-2-declared-surfaces.log

  - id: attempt-3-propagation-integrity
    description: >
      Attack absent and exact expiry semantics, explicit-over-derived
      precedence, single and batch propagation, idempotent re-projection, and
      tenant/scope field preservation.
    outcome: refuted
    detail: >
      Direct calls to both projector functions behaved correctly: permanent
      events omitted expiresAt, expiring events retained the exact Date, and
      agentId/scope/scopeRef were preserved. Re-projecting one path neither
      duplicated nor clobbered its insert-only text and expiry. Existing
      upstream TTL tests also passed and showed explicit expiry wins over the
      derived default. However, real single and batch manager writes lost the
      resolved expiry at the handoff to those otherwise-correct projectors.
      Because the projection update is $setOnInsert-only, re-projecting an
      already-created immortal chunk cannot backfill expiresAt; adding the
      omitted field only for future manager calls would not repair existing
      rows.
    evidence: refutation-c-005-attempt-3-propagation-integrity.log

  - id: attempt-4-sweep-race-integrity
    description: >
      Keep expired chunks physically present to model MongoDB TTL-monitor lag,
      test immediate visibility through each read shape, and mutate the
      conversation guard to an inverted past-only predicate.
    outcome: refuted
    detail: >
      The guarded conversation-search filter correctly hid past-expiry chunks
      while retaining future-expiry and expiresAt-absent chunks. Replacing it
      with expiresAt < now failed both focused guard tests and restoration was
      byte-identical. A separate stateful counterexample showed that
      buildBridgeChunkFilter, readConversationChunk, and readBridgeChunk omit
      the unexpired clause and all return an already-expired workspace
      conversation chunk during the sweep-lag window. Thus the claimed
      immediate exclusion does not cover every chunk-reading surface.
    evidence: refutation-c-005-attempt-4-sweep-race-integrity.log

  - id: attempt-5-missed-sites
    description: >
      Inventory other chunk writers and readers, verify tenant erasure, judge
      session-evidence scope, inspect analytics, and assess stale
      insert-only projection behavior.
    outcome: refuted
    detail: >
      projectConversationWindows is explicitly event-derived, reads session
      events without excluding expired rows, and writes source=conversation
      chunks without expiresAt. A stateful probe created a permanent window
      containing five expiring events. The outbox-repair call in
      mongodb-manager-sync.ts also reconstructs its projectEventChunk payload
      without expiresAt. Tenant erasure correctly deletes both chunks and
      session_chunks. The separate Option B session_chunks collection stores
      benchmark session evidence with sourceEventIds but has neither expiresAt
      nor a TTL index; maxSessionChunks actually caps filesystem transcript
      chunks written to the canonical chunks collection, not Option B. Option B
      is therefore another gap if "chunk projections" is interpreted literally,
      and otherwise needs a separately declared retention policy. No admin
      route listing raw chunk bodies was found; analytics does count expired
      rows during TTL lag. The canonical non-e2e engine suite remained green at
      127 files and 2105 tests, demonstrating that current coverage misses the
      real-path counterexamples.
    evidence: refutation-c-005-attempt-5-missed-sites.log

fix_applied_between_rounds: "none (round 1)"

conclusion: >
  Verdict: refuted in round 1. The decisive counterexample is the normal
  MongoDBManagerWriteOps path: event retention is correctly resolved and
  persisted on the event, but both single and batch projection payloads omit
  expiresAt, so the chunks TTL index never sees those chunks and no sweeper
  deletes them. Existing tests exercise the projector in isolation and do not
  cover this handoff. Additional gaps exist in outbox repair, event-derived
  conversation-window projection, and immediate read exclusion on bridge and
  direct locator surfaces. The documentation currently asserts full
  propagation without warning about these live gaps.

