      throttled marker and retry hint" and "denial never touches the
      database (no lanes, no coverage read)" — with the gate off, the
      denial path ran lanes and lost the throttled marker
      (metadata.throttled undefined). Identical RED set to the self-battery
      round 2. Restored byte-identically (cmp 0, sha match).
    evidence: refutation-c-018-r2-m1-search-v2-gate-vacuity.log

  - id: attempt-2-executor-marker
    description: >
      Executor throttle-marker propagation dropped. The round-1/2 mutation
      literal (`const throttled = ...find(...)` -> `const throttled =
      undefined`) was adapted to the current code shape: the find predicate
      `(pass) => pass.metadata.throttled != null,` -> `(pass) => false,` in
      packages/memory-engine/src/mongodb-search-executor.ts (1 occurrence).
      find can never select a throttled pass, so the merged `throttled`
      marker is always undefined — semantically identical vacuity.
    round_2_outcome: caught
    detail: >
      2 failed / 56 passed (58): "surfaces the throttle marker and retry
      hint in the merged response metadata" and "ends the pass loop on a
      throttled first pass — no follow-up attempts" (both: expected
