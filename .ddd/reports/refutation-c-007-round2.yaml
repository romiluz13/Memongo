conclusion: >
  Verdict: sustained. The round-1 weakness is closed and independently
  verified: the exact escape mutation (typed-const `= "voyage-4-large"` in
  backend-config.ts) now fails the pin test naming the file and form. Every
  realistic centralization-regression shape tested (bare ?? fallbacks in
  mongodb-search/sync/kb, stage-property literals in consolidator, typed and
  untyped const declarations) is caught by a named assertion failure. The
  contract assertion is load-bearing (no-op mutation caught) and wired into
  the single production resolution funnel (memory-bridge ->
  getMemorySearchManager -> resolveMemoryBackendConfig ->
  assertEmbeddingPipelineSupport). The sentinel spike proves drift is loud
  (98 failures: 78 config-resolution throws + value pins + pin anchor +
  stage pins). The dead provider stack is fully removed with zero residual
  references; kept modules intact; check-types (15/15) and build (11/11)
  pass; final engine suite 121 files / 2060 tests green. Remaining gaps are
  non-blocking: the pin gate does not cover scripts/benchmark (no static or
  drift-time net there — recommended hardening), and deliberately
  obfuscated literal shapes (split-with-cast, backtick) evade the regex
  gate but retain a drift-time equality net. Neither makes any claim
  statement false in tree.

