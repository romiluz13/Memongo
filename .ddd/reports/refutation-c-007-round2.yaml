non_blocking_observations:
  - id: obs-1-benchmark-outside-pin-root
    text: >
      STRONGEST OBSERVATION. The pin test scans only
      packages/memory-engine/src. A revert of the round-2 benchmark fix
      (scripts/benchmark/benchmark-parity-envelope.ts:236 back to the bare
      literal, mutation e3) passes every gate — engine battery 84/84 AND
      benchmark battery 37/37 — and, unlike engine decoupling, has NO
      drift-time net: benchmark-parity-envelope.test.ts:194 anchors the value
      literal (`toBe("voyage-4-large")`), not the derivation, so at
      INDEX_AUTOEMBED_MODEL drift the reverted benchmark passes silently.
      Outside the claim's declared constructs (diagnostic tooling); the tree
      satisfies F2. Recommended hardening (not required by the claim):
      extend the pin scan root to scripts/benchmark or change
      benchmark-parity-envelope.test.ts:194 to
      `expect(cfg.model).toBe(BENCHMARK_AUTOEMBED_MODEL)`.
  - id: obs-2-deliberate-evasion-class
    text: >
      The regex static gate cannot match deliberately obfuscated literals:
      a split literal with cast (`"voyage-4-" + "large" as
      MemoryMongoDBQueryEmbeddingModel`, mutation e4) or a backtick template
      literal (mutation e5) in backend-config.ts pass the battery AND
      check-types (tsc exit 0, verified). Both retain a drift-time net via
      the value-equality pin backend-config.test.ts:224 (fails the moment
      INDEX_AUTOEMBED_MODEL changes). These shapes require deliberate
      adversarial construction and are not realistic accidental regressions;
      the round-1 escape (the natural typed-const form) IS now caught.
  - id: obs-3-e2e-test-helper-literal
    text: >
      packages/memory-engine/src/test-helpers/preview-env.ts:153 keeps an
      e2e-only `?? "voyage-4-large"` direct-Voyage embedder; the pin test
      deliberately skips test-helpers/. Carried over from round 1;
      unchanged.
  - id: obs-4-vestigial-analytics-client-branch
    text: >
      mongodb-analytics.ts retains the "client" measurement branch (embeds
      nothing; unreachable from production because the manager always passes
      the resolved automated-only embeddingMode). Unchanged from round 1.
  - id: obs-5-pin-test-is-sole-static-gate
    text: >
      Control experiment (mutation a) re-confirms the pin test is the sole
      static gate for planted literals in engine sources: with its patterns
      neutralized, a bare `?? "voyage-4-large"` in mongodb-search.ts passes
      84/84. The un-neutralized gate catches every realistic shape tested
      (mutations c, d, e1, e2). This is a design fact, not a hole — but any
      future regression of the pin test itself (e.g. an over-broadened
      allow-list) would be invisible.

