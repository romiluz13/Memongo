    validations: []
    exceptions: []

  - id: C-032
    schema_version: 0.1.0
    statement: The embedding coverage probe MUST use exact nearest-neighbor with no numCandidates so the probe measures actual coverage rather than an approximation that can fabricate coverage.
    rationale: "The probe passes numCandidates to an ENN query where it is ignored, so the coverage signal can report coverage that approximate search would not reproduce."
    sources:
      - ref: "EL-002#recommendations"
        authority_domain: embedding-pipeline
        entailment: explicit
    claim_kind: mechanical
    impact: low
    tier: T0
    status: known-and-supported
    constructs: [packages/memory-engine/src/mongodb-manager-admin.ts]
    validations: []
    exceptions: []

  - id: C-033
    schema_version: 0.1.0
    statement: "Context expansion MUST parallelize per-session fetches with a bounded concurrency cap or a single facet-grouped query, removing the sequential N-plus-one from the search hot path."
    rationale: The only sequential N+1 on the search hot path multiplies latency by session count.
    sources:
      - ref: "EL-009#recommendations"
        authority_domain: performance-cost
        entailment: explicit
    claim_kind: behavioral
    impact: medium
    tier: T2
    status: known-and-supported
    constructs: [packages/memory-engine/src/mongodb-context-expansion.ts]
    validations: []
    exceptions: []

  - id: C-034
    schema_version: 0.1.0
    statement: "The episode auto-trigger cooldown MUST memoize its negative result per agent for about 60 seconds or move the 500-event scan fully into the background job, so the write path pays only a one-query cooldown check."
    rationale: "In the cold window the 500-event scan runs once per write, amplifying write cost by a constant factor."
    sources:
      - ref: "EL-009#recommendations"
        authority_domain: performance-cost
        entailment: explicit
    claim_kind: mechanical
    impact: medium
    tier: T1
    status: known-and-supported
    constructs: [packages/memory-engine/src/mongodb-episodes.ts, packages/memory-engine/src/mongodb-manager-write.ts]
    validations: []
    exceptions: []

  - id: C-035
    schema_version: 0.1.0
    statement: "The kb locator query in readFile MUST be scoped with agentId, scope, and scopeRef filters, with a regression test, closing the only unfiltered cross-tenant read path."
    rationale: "The kb locator is the only MongoDB query without an agentId or scope filter, making knowledge-base content readable across tenants."
