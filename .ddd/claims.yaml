  - id: C-031
    schema_version: 0.1.0
    statement: The rerank timeout MUST derive from the remaining latency budget or lower its fixed default so one provider cannot double the P95 contract ceiling.
    rationale: The fixed 2-second rerank timeout stacks on probe-miss and slow-lane worst cases for a 13.5-second arithmetic worst case that no test measures.
    sources:
      - ref: "EL-003#recommendations"
        authority_domain: retrieval-quality
        entailment: explicit
    claim_kind: behavioral
    impact: medium
    tier: T2
    status: known-and-supported
