  - id: C-037
    schema_version: 0.1.0
    statement: "The Docker build context MUST be effectively ignored: a root .dockerignore or Dockerfile-specific ignore file MUST exist so the build stops shipping .git, node_modules, benchmarks, and root dot-env files into context and cache."
    rationale: The existing .dockerignore is never applied because Docker resolves ignore files from the context root and the compose build uses the repo root as context.
