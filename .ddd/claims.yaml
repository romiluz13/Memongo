  - id: C-036
    schema_version: 0.1.0
    statement: "pi-extension auto-capture MUST be explicit opt-in with a default off or a first-run notice, and MUST state exactly what is sent, which is raw user and assistant turns."
    rationale: "Auto-capture is on by default and ships raw conversation turns with no consent gate or redaction, so pasted credentials in chat become durable API-side records by default."
