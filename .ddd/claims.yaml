  - id: C-040
    schema_version: 0.1.0
    statement: "Model-visible retrieval payloads from the AI-SDK tools and the MCP server MUST carry the untrusted-memory quarantine envelope (or an equivalent provenance label) so stored memory rendered into a model context is never presented as trusted system text: memongo_search, search_kb, profile, build_context_bundle, recall_conversation, and the MCP tool results that serialize the same payloads."
    rationale: "Filed from the WS-05 round-2 refutation (REF-WS05-R2, finding uncovered-injection-surfaces): the C-008 envelope landed on the pi surfaces named by EL-005's S-3 finding (in findings (severity-ranked)), but the AI-SDK tools (packages/tools/src/index.ts createMemongoTools) return raw stored search/KB/profile/context-bundle payloads and the MCP server serializes them raw as well. Stored conversation events, KB chunks, and profile text are not gated by the write-structured classifier, so these are real injection surfaces; they were outside C-008's evidenced scope and are tracked here instead."
    sources:
      - ref: "REF-WS05-R2#findings/uncovered-injection-surfaces"
        authority_domain: security
        entailment: explicit
    claim_kind: behavioral
    impact: high
    tier: T2
    status: known-and-supported
    constructs: [packages/tools/src/index.ts, apps/mcp/src/server.ts]
    validations: []
    exceptions: []
